name: ESPN and site check

# ESPN's scoreboard is undocumented and can change without notice. This job
# fetches it every day and fails loudly (red run + GitHub email) when the shape
# the app reads has changed. It also checks that the live site answers.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip pytest numpy pandas
      - name: ESPN scoreboard still has the fields the app reads
        env:
          FD_LIVE_CHECK: "1"
        run: python -m pytest tests/test_live.py -k live_espn -q
      - name: Live site answers
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://willhoop.github.io/fourth-down/
