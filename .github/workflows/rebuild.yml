name: Rebuild model

# Refit the models, rebuild the confidence models and regrade every coach, on
# GitHub's machines. Nothing runs on, or is stored on, the owner's PC: the
# play-by-play is downloaded into this runner and deleted with it. Start it from
# the Actions tab ("Run workflow") or with: gh workflow run rebuild.yml
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip pandas pyarrow numpy scikit-learn pytest
      - name: Download play-by-play (into this runner only)
        run: python engine/download_data.py --force
      - name: Fit the models
        run: python engine/fit_models.py
      - name: Confidence models (20 game-resampled refits)
        run: python engine/bootstrap.py
      - name: Grade every coach
        run: python engine/grade_coaches.py
      - name: Weekly game and Games tab
        run: python engine/weekly.py
      - name: Comparison with nfl4th
        run: python engine/compare_nfl4th.py --download
      - name: Reports and the white paper's generated figures
        run: python build/render_reports.py
      - name: Tests
        run: python -m pytest tests -q
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fourth-down-bot"
          git config user.email "fourth-down-bot@users.noreply.github.com"
          git add app data docs
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild model: $(date -u +%Y-%m-%d)"
          git push
          gh workflow run pages.yml
