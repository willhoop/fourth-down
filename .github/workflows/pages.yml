name: Pages

# Publishes the app (app/ folder) to GitHub Pages on every push to main,
# after the test suite passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip pytest numpy pandas
      - run: python -m pytest tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp app/index.html app/engine.js app/model.js app/grades.js app/bootstrap.js _site/
          cp assets/icon.png _site/icon.png
          REPO="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          sed -i "s#\.\./assets/icon.png#icon.png#g; s#\.\./docs/#${REPO}/docs/#g; s#\.\./build/#${REPO}/build/#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
